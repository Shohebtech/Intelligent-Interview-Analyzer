{% extends "base.html" %}

{% block title %}Candidate Login - Intelligent Interview Analyzer{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="custom-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="feature-icon mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.6rem;">
            <i class="fa-solid fa-user-lock"></i>
          </div>
          <h3 class="fw-bold mb-1">Candidate Sign In</h3>
          <p class="text-secondary small">Access your registered interview portal</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address or Candidate ID <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-id-badge"></i></span>
              <input type="text" name="identifier" class="form-control" placeholder="user@example.com or CAND-XXXX" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-semibold mb-0">Password <span class="text-danger">*</span></label>
              <a href="{{ url_for('auth.forgot_password') }}" class="text-info small text-decoration-none">
                Forgot Password?
              </a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-key"></i></span>
              <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter your password" required>
              <button type="button" class="input-group-text bg-dark border-secondary text-secondary toggle-pw-btn" onclick="togglePasswordVisibility('loginPassword', this)">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-gradient w-100 py-2 fw-bold mt-2">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Log In to Portal
          </button>
        </form>

        <div class="mt-4 pt-3 text-center border-top border-secondary border-opacity-25 small">
          <span class="text-secondary">Not registered yet?</span>
          <a href="{{ url_for('auth.register') }}" class="text-info fw-semibold ms-1">Register with Webcam</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function togglePasswordVisibility(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fa-solid fa-eye-slash text-info';
    } else {
      input.type = 'password';
      icon.className = 'fa-solid fa-eye';
    }
  }
</script>
{% endblock %}
